<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar maker</title>
<meta name="description" content="Build an Open Peeps avatar, add patches to your clothes, and download it as SVG or PNG.">
<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --ink:#1b2430; --muted:#5b6776; --line:#d6dde6;
  --accent:#1f4e9c; --accent-ink:#ffffff; --accent-soft:#e3ebf8; --warn:#9c3d1f; --ok:#1f7a4d;
  --radius:10px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.15fr);gap:14px;padding:14px;max-width:1100px;margin:0 auto}
@media (max-width:720px){.app{grid-template-columns:1fr;padding:10px 16px}}
.stage-wrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.views{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px}
.views button{flex:1;border:0;background:none;padding:7px 6px;border-radius:7px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);aspect-ratio:1/1;overflow:hidden;touch-action:none}
.stage svg{width:100%;height:100%;display:block}
.stage .patch{cursor:grab}
.stage .patch.dragging{cursor:grabbing}
.sel-box{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:12 8;vector-effect:non-scaling-stroke}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{min-height:1.4em;font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 28px)}
@media (max-width:720px){.panel{max-height:none}}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabbody{padding:10px;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.opt{position:relative;border:2px solid transparent;background:#f7f9fc;border-radius:8px;padding:2px;cursor:pointer;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.opt svg{width:100%;height:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.none{font-size:13px;color:var(--muted)}
.opt .flag{position:absolute;top:2px;right:4px;font-size:11px;font-weight:700}
.opt.is-hidden{opacity:.35}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.row label{min-width:88px;font-size:14px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;outline:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
h2{font-size:14px;margin:12px 0 6px;color:var(--muted);font-weight:600}
h2:first-child{margin-top:0}
.hint{font-size:13px;color:var(--muted);margin:4px 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* admin */
.admin{border-top:3px solid var(--warn)}
.admin .tabbody{font-size:14px}
.kbd{font:12px ui-monospace,monospace;background:#eef1f5;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:#eef1f5}
.pill.ok{background:#dff2e8;color:var(--ok)} .pill.bad{background:#f8e3dc;color:var(--warn)}
.conf{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.wall{position:fixed;inset:0;background:rgba(20,28,40,.55);display:none;z-index:10;padding:16px;overflow:auto}
.wall.open{display:block}
.wall-inner{background:var(--panel);border-radius:var(--radius);padding:12px;max-width:1100px;margin:0 auto}
.wall .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wall .opt{aspect-ratio:auto;flex-direction:column;cursor:pointer;padding:4px}
.wall .opt svg{height:150px}
.wall .opt span{font-size:12px}
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap">
    <div class="views" role="group" aria-label="View">
      <button data-view="bust">Head &amp; shoulders</button>
      <button data-view="standing">Standing</button>
      <button data-view="sitting">Sitting</button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="actions">
      <button class="btn" id="random">Randomize</button>
      <button class="btn" id="dl-svg">Download SVG</button>
      <button class="btn primary" id="dl-png">Download PNG</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
    <div class="panel">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="tabbody" id="tabbody"></div>
    </div>
    <div class="panel admin" id="admin" hidden></div>
  </div>
</div>
<div class="wall" id="wall"><div class="wall-inner" id="wall-inner"></div></div>
<script src="parts/parts.js"></script>
<script src="config/layers.js"></script>
<script src="patches/patches.js"></script>
<script src="app.js"></script>
</body>
</html>
